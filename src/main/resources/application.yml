spring:
  application:
    name: producao-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/producao_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

seguranca:
  jwt:
    segredo: ${JWT_SEGREDO:chave-desenvolvimento-nao-usar-em-producao}
    expiracao-ms: 86400000

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080
  servlet:
    context-path: /api
